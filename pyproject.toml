[project]
name = "tasktrackapi"
version = "0.1.0"
description = "An API for creating tasks with a description and marking them done when completed."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]
[tool.ruff]
extend-exclude = [
    "migrations",
]
